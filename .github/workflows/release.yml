name: Package release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build KEH Updater
        shell: bash
        run: |
          mkdir -p package
          dotnet publish Updater/KEHUpdater.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true
          cp Updater/bin/Release/net8.0-windows/win-x64/publish/KEH-Updater.exe \
            package/KEH-Updater.exe

      - name: Build addon archive
        shell: bash
        run: |
          mkdir -p package/KjellmanESOHelper
          cp *.lua *.txt package/KjellmanESOHelper/
          cd package
          zip -r "KjellmanESOHelper-${GITHUB_REF_NAME}.zip" KjellmanESOHelper

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "package/KjellmanESOHelper-${GITHUB_REF_NAME}.zip" \
            "package/KEH-Updater.exe" \
            --title "Kjellman ESO Helper ${GITHUB_REF_NAME}" \
            --generate-notes
